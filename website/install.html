<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Install Recallith</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css?v=2" />
    <link rel="stylesheet" href="css/reset.css?v=2" />
    <link rel="stylesheet" href="css/layout.css?v=2" />
    <link rel="stylesheet" href="css/components.css?v=2" />
    <link rel="stylesheet" href="css/pages/install.css?v=2" />
  </head>
  <body>
    <nav class="site-navigation">
      <div class="page-container site-navigation-inner">
        <a class="site-wordmark" href="index.html">Recallith</a
        ><a class="button button--primary" href="download.html">Download</a>
      </div>
    </nav>
    <main class="page-section page-container">
      <div class="section-label" id="progress">Step 1 of 4</div>
      <h2>Install Recallith</h2>
      <div class="install-tabs">
        <button class="button install-tab install-tab--selected" data-os="windows">Windows x64</button>
      </div>
      <p class="supporting-text">Windows x64 only. macOS and Linux are not available yet.</p>
      <div id="steps"></div>
    </main>
    <script>
      const store = "https://chromewebstore.google.com/search/Recallith";
      let os = "windows";
      const instructions = {
        windows: [
          '<a href="download.html">Download</a> Recallith_0.1.1_x64-setup.exe for Windows x64 and follow the installer prompts. The installer is unsigned and Windows SmartScreen may warn on first run; verify the SHA-256 shown on the download page before running it.',
          "If SmartScreen warns, first verify the SHA-256 shown on the download page. If you choose to proceed, select More info &gt; Run anyway.",
        ],
      };
      function render() {
        steps.innerHTML = [
          `<div class="install-step"><b class="install-step-number">1</b><div><h3>Install the desktop app</h3><p>${instructions[os][0]}</p><details><summary>Common issue</summary><p>${instructions[os][1]}</p></details></div></div>`,
          `<div class="install-step"><b class="install-step-number">2</b><div><h3>Add the Chrome extension</h3><p>Install the browser capture companion. Version 0.3.3 is pending Chrome Web Store review; the live store version may be older.</p><a class="button button--primary" href="${store}" target="_blank">Add to Chrome</a><p id="extension" class="supporting-text">Waiting for extension detection…</p></div></div>`,
          `<div class="install-step"><b class="install-step-number">3</b><div><h3>First launch</h3><p>Recallith asks new and existing users to review and save capture settings before it captures anything. Choose your AI provider and capture categories. Encryption keys are held in your OS keychain and cannot be recovered if removed.</p></div></div>`,
          `<div class="install-step"><b class="install-step-number">4</b><div><h3>Verify it works</h3><p>Ask a unique question in Claude or ChatGPT, open Recallith, and search for the same phrase.</p><span class="install-status">✓ Your private memory is ready</span></div></div>`,
        ].join("");
      }
      document.querySelectorAll(".install-tab").forEach(
        (button) =>
          (button.onclick = () => {
            os = button.dataset.os;
            document
              .querySelectorAll(".install-tab")
              .forEach((x) => x.classList.toggle("install-tab--selected", x === button));
            render();
          }),
      );
      window.addEventListener("message", (event) => {
        if (event.data?.type === "RECALLITH_EXTENSION_PRESENT")
          document.querySelector("#extension").textContent = "Extension installed ✓";
      });
      render();
    </script>
  </body>
</html>
