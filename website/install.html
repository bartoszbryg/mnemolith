<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Install Recallith</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
  </head>
  <body>
    <nav class="nav">
      <div class="wrap"><a class="wordmark" href="index.html">Recallith</a><a class="button primary" href="download.html">Download</a></div>
    </nav>
    <main class="section wrap">
      <div class="eyebrow" id="progress">Step 1 of 4</div>
      <h2>Install Recallith</h2>
      <div class="tabs"><button class="button tab active" data-os="windows">Windows</button><button class="button tab" data-os="mac">Mac</button><button class="button tab" data-os="linux">Linux</button></div>
      <div id="steps"></div>
    </main>
    <script>
      const store = "https://chromewebstore.google.com/search/Recallith";
      let os = "windows";
      const instructions = {
        windows: ["Run the .exe installer and follow the prompts.", "If SmartScreen appears, choose More info → Run anyway."],
        mac: ["Open the .dmg and drag Recallith to Applications.", "For an unidentified developer warning, right-click Recallith → Open."],
        linux: ["Run chmod +x Recallith.AppImage, then launch it.", "On Debian-based systems, install the .deb package instead."]
      };

      function render() {
        steps.innerHTML = [`<div class="step"><b class="step-num">1</b><div><h3>Install the desktop app</h3><p>${instructions[os][0]}</p><details><summary>Common issue</summary><p>${instructions[os][1]}</p></details></div></div>`, `<div class="step"><b class="step-num">2</b><div><h3>Add the Chrome extension</h3><p>Install the browser capture companion.</p><a class="button primary" href="${store}" target="_blank">Add to Chrome</a><p id="extension" class="muted">Waiting for extension detection…</p></div></div>`, `<div class="step"><b class="step-num">3</b><div><h3>First launch</h3><p>Choose your AI provider and capture categories. Encryption keys are held in your OS keychain and cannot be recovered if removed.</p></div></div>`, `<div class="step"><b class="step-num">4</b><div><h3>Verify it works</h3><p>Ask a unique question in Claude or ChatGPT, open Recallith, and search for the same phrase.</p><span style="color:#68c987">✓ Your private memory is ready</span></div></div>`].join("")
      }
      document.querySelectorAll(".tab").forEach(button => button.onclick = () => {
        os = button.dataset.os;
        document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === button));
        render()
      });
      window.addEventListener("message", event => {
        if (event.data?.type === "RECALLITH_EXTENSION_PRESENT") document.querySelector("#extension").textContent = "Extension installed ✓"
      });
      render();
    </script>
  </body>
</html>
