<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Recallith</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=2">
  <link rel="stylesheet" href="css/reset.css?v=2">
  <link rel="stylesheet" href="css/layout.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">
  <link rel="stylesheet" href="css/pages/auth.css?v=2">



</head>
<body>
  <nav class="auth-navigation"><a class="auth-brand site-wordmark" href="index.html"><img src="assets/mnemolith.svg" alt=""><span>Recallith</span></a></nav>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-deletion-notice" id="account-deleted-banner" role="status" hidden>Your account has been successfully deleted. Thank you for using Recallith.</div>
      <h1>Welcome back.</h1><p class="auth-introduction">Your memory is waiting.</p>
      <div class="auth-tabs" role="tablist"><button class="auth-tab" role="tab" data-panel="signin" aria-selected="true">Sign in</button><button class="auth-tab" role="tab" data-panel="signup" aria-selected="false">Create account</button></div>
      <form class="auth-panel" id="signin" novalidate>
        <label class="auth-field">Email<input class="auth-input" id="signin-email" type="email" autocomplete="email" required></label>
        <label class="auth-field">Password<span class="auth-password"><input class="auth-input auth-password-input" id="signin-password" type="password" autocomplete="current-password" required><button class="auth-password-toggle" type="button" data-password-toggle="signin-password" aria-label="Show password" aria-pressed="false"><svg class="auth-password-icon auth-password-icon--show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="auth-password-icon auth-password-icon--hide" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.1A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-2.1 2.8M6.7 6.7C3.6 8.5 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.7M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label>
        <button class="button button--primary auth-submit" type="submit">Sign in</button>
        <button class="auth-recovery-button" id="forgot" type="button">Forgot password?</button>
        <div class="auth-divider">or</div><button class="button auth-google-button" data-google type="button"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285f4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.8 2.7-6.5Z"/><path fill="#34a853" d="M9 18c2.4 0 4.5-.8 6-2.2L12 13.5c-.8.6-1.8.9-3 .9a5.3 5.3 0 0 1-5-3.7H1v2.3A9 9 0 0 0 9 18Z"/><path fill="#fbbc05" d="M4 10.7a5.4 5.4 0 0 1 0-3.4V5H1a9 9 0 0 0 0 8l3-2.3Z"/><path fill="#ea4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3L15 2.3A8.7 8.7 0 0 0 1 5l3 2.3A5.3 5.3 0 0 1 9 3.6Z"/></svg>Continue with Google</button>
        <p class="auth-switch">Don’t have an account? <button type="button" data-switch="signup">Create one</button></p>
      </form>
      <form class="auth-panel" id="signup" hidden novalidate>
        <label class="auth-field">Full name<input class="auth-input" id="signup-name" type="text" autocomplete="name" required></label>
        <label class="auth-field">Email<input class="auth-input" id="signup-email" type="email" autocomplete="email" required></label>
        <label class="auth-field">Password<span class="auth-password"><input class="auth-input auth-password-input" id="signup-password" type="password" autocomplete="new-password" minlength="8" required><button class="auth-password-toggle" type="button" data-password-toggle="signup-password" aria-label="Show password" aria-pressed="false"><svg class="auth-password-icon auth-password-icon--show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="auth-password-icon auth-password-icon--hide" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.1A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-2.1 2.8M6.7 6.7C3.6 8.5 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.7M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label>
        <label class="auth-field">Confirm password<span class="auth-password"><input class="auth-input auth-password-input" id="signup-confirm" type="password" autocomplete="new-password" minlength="8" required><button class="auth-password-toggle" type="button" data-password-toggle="signup-confirm" aria-label="Show password" aria-pressed="false"><svg class="auth-password-icon auth-password-icon--show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="auth-password-icon auth-password-icon--hide" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.1A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-2.1 2.8M6.7 6.7C3.6 8.5 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.7M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label>
        <button class="button button--primary auth-submit" type="submit">Create account</button>
        <p class="auth-consent">
          By creating an account you agree to our
          <a href="terms.html">Terms of Service</a> and
          <a href="privacy.html">Privacy Policy</a>.
        </p>
        <div class="auth-divider">or</div><button class="button auth-google-button" data-google type="button"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285f4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.8 2.7-6.5Z"/><path fill="#34a853" d="M9 18c2.4 0 4.5-.8 6-2.2L12 13.5c-.8.6-1.8.9-3 .9a5.3 5.3 0 0 1-5-3.7H1v2.3A9 9 0 0 0 9 18Z"/><path fill="#fbbc05" d="M4 10.7a5.4 5.4 0 0 1 0-3.4V5H1a9 9 0 0 0 0 8l3-2.3Z"/><path fill="#ea4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3L15 2.3A8.7 8.7 0 0 0 1 5l3 2.3A5.3 5.3 0 0 1 9 3.6Z"/></svg>Continue with Google</button>
        <p class="auth-switch">Already have an account? <button type="button" data-switch="signin">Sign in</button></p>
      </form>
      <div class="auth-message" id="message" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script type="module">
    import { isLoggedIn, signInWithEmail, signInWithGoogle, signUpWithEmail, supabase } from "./js/auth.js?v=2";
    import { initNav } from "./js/nav.js?v=2";
    initNav({ activePage: "login.html" });
    const params = new URLSearchParams(location.search);
    document.querySelector("#account-deleted-banner").hidden = params.get("message") !== "account_deleted";
    const requested = params.get("next");
    const destination = requested?.startsWith("/") && !requested.startsWith("//") ? requested : "/account.html";
    if (isLoggedIn()) location.replace(destination);
    const message = document.querySelector("#message");
    function showMessage(text, success = false){message.textContent=text;message.classList.toggle("auth-message--success",success)}
    function showPanel(id){document.querySelectorAll(".auth-panel").forEach(panel=>panel.hidden=panel.id!==id);document.querySelectorAll(".auth-tab").forEach(tab=>tab.setAttribute("aria-selected",String(tab.dataset.panel===id)));showMessage("")}
    function loading(button,on){button.disabled=on;if(on){button.dataset.label=button.textContent;button.innerHTML='<span class="loading-spinner" aria-label="Loading"></span>'}else button.textContent=button.dataset.label}
    document.querySelectorAll(".auth-tab").forEach(tab=>tab.addEventListener("click",()=>showPanel(tab.dataset.panel)));
    document.querySelectorAll("[data-switch]").forEach(button=>button.addEventListener("click",()=>showPanel(button.dataset.switch)));
    document.querySelectorAll("input").forEach(input=>input.addEventListener("input",()=>showMessage("")));
    document.querySelectorAll("[data-password-toggle]").forEach(button=>button.addEventListener("click",()=>{const input=document.getElementById(button.dataset.passwordToggle);const showing=input.type==="text";input.type=showing?"password":"text";button.setAttribute("aria-pressed",String(!showing));button.setAttribute("aria-label",showing?"Show password":"Hide password");input.focus()}));
    document.querySelectorAll("[data-google]").forEach(button=>button.addEventListener("click",async()=>{const {error}=await signInWithGoogle();if(error)showMessage(error.message)}));
    document.querySelector("#signin").addEventListener("submit",async event=>{event.preventDefault();const button=event.currentTarget.querySelector(".auth-submit");loading(button,true);const {error}=await signInWithEmail(document.querySelector("#signin-email").value.trim(),document.querySelector("#signin-password").value);if(error){showMessage(error.message);loading(button,false)}else location.assign(destination)});
    document.querySelector("#signup").addEventListener("submit",async event=>{event.preventDefault();const password=document.querySelector("#signup-password").value;const confirm=document.querySelector("#signup-confirm").value;if(password.length<8)return showMessage("Password must be at least 8 characters.");if(password!==confirm)return showMessage("Passwords do not match.");const button=event.currentTarget.querySelector(".auth-submit");loading(button,true);const {error}=await signUpWithEmail(document.querySelector("#signup-email").value.trim(),password,document.querySelector("#signup-name").value.trim());if(error){showMessage(error.message);loading(button,false)}else{showMessage("Check your email to confirm your account.",true);loading(button,false)}});
    document.querySelector("#forgot").addEventListener("click",async()=>{const email=document.querySelector("#signin-email").value.trim();if(!email)return showMessage("Enter your email address first.");const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:`${location.origin}/auth/callback.html?type=recovery`});showMessage(error?error.message:"Reset email sent.",!error)});
    if(params.get("error")==="oauth_failed")showMessage("Google sign-in could not be completed. Please try again.");
    if(params.get("error")==="recovery_failed")showMessage("This password reset link is invalid or has expired. Request a new one.");
    if(params.get("success")==="password_updated")showMessage("Password updated. Sign in with your new password.",true);
  </script>
</body>
</html>
