<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set new password — Recallith</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=2">
  <link rel="stylesheet" href="css/reset.css?v=2">
  <link rel="stylesheet" href="css/layout.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">
  <link rel="stylesheet" href="css/pages/auth.css?v=2">



</head>
<body>
  <nav class="auth-navigation"><a class="auth-brand site-wordmark" href="index.html"><img src="assets/mnemolith.svg" alt=""><span>Recallith</span></a></nav>
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Set a new password.</h1>
      <p class="auth-introduction">Choose a secure password for your Recallith account.</p>
      <form id="reset-form" novalidate>
        <label class="auth-field">New password<span class="auth-password"><input class="auth-input auth-password-input" id="new-password" type="password" autocomplete="new-password" minlength="8" required><button class="auth-password-toggle" type="button" data-password-toggle="new-password" aria-label="Show password" aria-pressed="false"><svg class="auth-password-icon auth-password-icon--show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="auth-password-icon auth-password-icon--hide" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.1A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-2.1 2.8M6.7 6.7C3.6 8.5 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.7M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label>
        <label class="auth-field">Confirm new password<span class="auth-password"><input class="auth-input auth-password-input" id="confirm-password" type="password" autocomplete="new-password" minlength="8" required><button class="auth-password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show password" aria-pressed="false"><svg class="auth-password-icon auth-password-icon--show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="auth-password-icon auth-password-icon--hide" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.1A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-2.1 2.8M6.7 6.7C3.6 8.5 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.7M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label>
        <button class="button button--primary auth-submit" type="submit">Update password</button>
      </form>
      <div class="auth-message" id="message" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script type="module">
    import { supabase } from "./js/auth.js?v=2";
    const form = document.querySelector("#reset-form");
    const message = document.querySelector("#message");
    const button = form.querySelector(".auth-submit");
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) location.replace("/login.html?error=recovery_failed");
    function showMessage(text, success = false){message.textContent=text;message.classList.toggle("auth-message--success",success)}
    function loading(on){button.disabled=on;if(on){button.dataset.label=button.textContent;button.innerHTML='<span class="loading-spinner" aria-label="Loading"></span>'}else button.textContent=button.dataset.label}
    document.querySelectorAll("input").forEach(input=>input.addEventListener("input",()=>showMessage("")));
    document.querySelectorAll("[data-password-toggle]").forEach(toggle=>toggle.addEventListener("click",()=>{const input=document.getElementById(toggle.dataset.passwordToggle);const showing=input.type==="text";input.type=showing?"password":"text";toggle.setAttribute("aria-pressed",String(!showing));toggle.setAttribute("aria-label",showing?"Show password":"Hide password");input.focus()}));
    form.addEventListener("submit",async event=>{
      event.preventDefault();
      const password=document.querySelector("#new-password").value;
      const confirm=document.querySelector("#confirm-password").value;
      if(password.length<8)return showMessage("Password must be at least 8 characters.");
      if(password!==confirm)return showMessage("Passwords do not match.");
      loading(true);
      const { error }=await supabase.auth.updateUser({password});
      if(error){showMessage(error.message);loading(false);return}
      showMessage("Password updated. Redirecting to sign in…",true);
      await supabase.auth.signOut();
      location.replace("/login.html?success=password_updated");
    });
  </script>
</body>
</html>
