<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Set new password — Recallith</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/tokens.css" />
        <style>
            body {
                min-height: 100vh;
                background: radial-gradient(circle at 50% 0, #211c0f 0, transparent 36%), var(--bg);
            }
            .reset-nav {
                height: 70px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
            }
            .brand img {
                width: 30px;
                height: 30px;
            }
            .reset-shell {
                width: min(420px, calc(100% - 32px));
                margin: 25px auto 70px;
            }
            .reset-card {
                padding: 30px;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: #111;
                box-shadow: 0 28px 80px #0008;
            }
            .reset-card h1 {
                margin: 0 0 8px;
                font-size: 42px;
                text-align: center;
            }
            .subhead {
                margin: 0 0 26px;
                color: var(--muted);
                text-align: center;
            }
            .field {
                display: block;
                margin-bottom: 16px;
                font-size: 13px;
                font-weight: 600;
            }
            .password-wrap {
                position: relative;
                display: block;
            }
            .field input {
                width: 100%;
                margin-top: 7px;
                padding: 13px 48px 13px 14px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: #0b0b0b;
                color: var(--text);
                font: 16px Inter;
                outline: none;
            }
            .field input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px #c9a84c18;
            }
            .password-toggle {
                position: absolute;
                right: 4px;
                bottom: 4px;
                display: grid;
                width: 40px;
                height: 40px;
                padding: 0;
                place-items: center;
                border: 0;
                border-radius: 5px;
                background: transparent;
                color: var(--muted);
                cursor: pointer;
            }
            .password-toggle:hover {
                color: var(--text);
                background: #1b1b1b;
            }
            .password-toggle:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: -2px;
            }
            .password-toggle svg {
                width: 20px;
                height: 20px;
                fill: none;
                stroke: currentColor;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-width: 1.8;
            }
            .password-toggle .eye-off {
                display: none;
            }
            .password-toggle[aria-pressed="true"] .eye {
                display: none;
            }
            .password-toggle[aria-pressed="true"] .eye-off {
                display: block;
            }
            .submit {
                width: 100%;
                min-height: 47px;
                margin-top: 5px;
            }
            .message {
                min-height: 22px;
                margin: 17px 0 0;
                color: #e05555;
                font-size: 14px;
                text-align: center;
            }
            .message.success {
                color: #68c987;
            }
            .spinner {
                display: inline-block;
                width: 18px;
                height: 18px;
                border: 2px solid #1115;
                border-top-color: #111;
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <nav class="reset-nav">
            <a class="brand wordmark" href="index.html"
                ><img src="assets/mnemolith.svg" alt="" /><span>Recallith</span></a
            >
        </nav>
        <main class="reset-shell">
            <section class="reset-card">
                <h1>Set a new password.</h1>
                <p class="subhead">Choose a secure password for your Recallith account.</p>
                <form id="reset-form" novalidate>
                    <label class="field"
                        >New password<span class="password-wrap"
                            ><input
                                id="new-password"
                                type="password"
                                autocomplete="new-password"
                                minlength="8"
                                required /><button
                                class="password-toggle"
                                type="button"
                                data-password-toggle="new-password"
                                aria-label="Show password"
                                aria-pressed="false"
                            >
                                <svg class="eye" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                                    <circle cx="12" cy="12" r="3" /></svg
                                ><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                    <path
                                        d="m3 3 18 18M10.6 6.1A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-2.1 2.8M6.7 6.7C3.6 8.5 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.7M9.9 9.9a3 3 0 0 0 4.2 4.2"
                                    />
                                </svg></button></span
                    ></label>
                    <label class="field"
                        >Confirm new password<span class="password-wrap"
                            ><input
                                id="confirm-password"
                                type="password"
                                autocomplete="new-password"
                                minlength="8"
                                required /><button
                                class="password-toggle"
                                type="button"
                                data-password-toggle="confirm-password"
                                aria-label="Show password"
                                aria-pressed="false"
                            >
                                <svg class="eye" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                                    <circle cx="12" cy="12" r="3" /></svg
                                ><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                    <path
                                        d="m3 3 18 18M10.6 6.1A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-2.1 2.8M6.7 6.7C3.6 8.5 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.7M9.9 9.9a3 3 0 0 0 4.2 4.2"
                                    />
                                </svg></button></span
                    ></label>
                    <button class="button primary submit" type="submit">Update password</button>
                </form>
                <div class="message" id="message" role="status" aria-live="polite"></div>
            </section>
        </main>
        <script type="module">
            import { supabase } from "./js/auth.js";
            const form = document.querySelector("#reset-form");
            const message = document.querySelector("#message");
            const button = form.querySelector(".submit");
            const {
                data: { session },
            } = await supabase.auth.getSession();
            if (!session) location.replace("/login.html?error=recovery_failed");
            function showMessage(text, success = false) {
                message.textContent = text;
                message.classList.toggle("success", success);
            }
            function loading(on) {
                button.disabled = on;
                if (on) {
                    button.dataset.label = button.textContent;
                    button.innerHTML = '<span class="spinner" aria-label="Loading"></span>';
                } else button.textContent = button.dataset.label;
            }
            document
                .querySelectorAll("input")
                .forEach((input) => input.addEventListener("input", () => showMessage("")));
            document.querySelectorAll("[data-password-toggle]").forEach((toggle) =>
                toggle.addEventListener("click", () => {
                    const input = document.getElementById(toggle.dataset.passwordToggle);
                    const showing = input.type === "text";
                    input.type = showing ? "password" : "text";
                    toggle.setAttribute("aria-pressed", String(!showing));
                    toggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
                    input.focus();
                })
            );
            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const password = document.querySelector("#new-password").value;
                const confirm = document.querySelector("#confirm-password").value;
                if (password.length < 8) return showMessage("Password must be at least 8 characters.");
                if (password !== confirm) return showMessage("Passwords do not match.");
                loading(true);
                const { error } = await supabase.auth.updateUser({ password });
                if (error) {
                    showMessage(error.message);
                    loading(false);
                    return;
                }
                showMessage("Password updated. Redirecting to sign in…", true);
                await supabase.auth.signOut();
                location.replace("/login.html?success=password_updated");
            });
        </script>
    </body>
</html>
